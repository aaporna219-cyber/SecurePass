<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Profile | SecurePass</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="css/style.css">
</head>


<body class="d-flex flex-column min-vh-100">


    <!-- Navbar -->
    <div id="navbarContainer"></div>


    <!-- Main Content -->
    <main class="flex-grow-1">

        <section class="page-section">

            <div class="container">

                <!-- Header -->
                <div class="text-center mb-5">

                    <span class="badge text-bg-primary px-3 py-2 mb-3">
                        <i class="bi bi-person-circle me-1"></i>
                        My Profile
                    </span>

                    <h1 class="fw-bold mb-3">
                        Account Profile
                    </h1>

                    <p class="text-secondary">
                        View your SecurePass account information.
                    </p>

                </div>


                <!-- Profile Card -->
                <div class="row justify-content-center">

                    <div class="col-lg-7 col-md-9">

                        <div class="card shadow-sm border-0">

                            <div class="card-body p-5">


                                <!-- Profile Icon -->
                                <div class="text-center mb-4">

                                    <div
                                        class="rounded-circle bg-primary text-white d-inline-flex align-items-center justify-content-center"
                                        style="width: 90px; height: 90px; font-size: 40px;">

                                        <i class="bi bi-person"></i>

                                    </div>

                                </div>


                                <!-- Name -->
                                <div class="mb-4">

                                    <label class="form-label fw-semibold">
                                        <i class="bi bi-person me-2"></i>
                                        Full Name
                                    </label>

                                    <div
                                        id="profileName"
                                        class="form-control bg-light">
                                        -
                                    </div>

                                </div>


                                <!-- Email -->
                                <div class="mb-4">

                                    <label class="form-label fw-semibold">
                                        <i class="bi bi-envelope me-2"></i>
                                        Email Address
                                    </label>

                                    <div
                                        id="profileEmail"
                                        class="form-control bg-light">
                                        -
                                    </div>

                                </div>


                                <!-- Role -->
                                <div class="mb-4">

                                    <label class="form-label fw-semibold">
                                        <i class="bi bi-shield-check me-2"></i>
                                        Account Type
                                    </label>

                                    <div>

                                        <span
                                            id="profileRole"
                                            class="badge text-bg-primary fs-6">
                                            User
                                        </span>

                                    </div>

                                </div>


                                <!-- Status -->
                                <div class="mb-4">

                                    <label class="form-label fw-semibold">
                                        <i class="bi bi-check-circle me-2"></i>
                                        Account Status
                                    </label>

                                    <div>

                                        <span
                                            id="profileStatus"
                                            class="badge text-bg-success fs-6">
                                            Active
                                        </span>

                                    </div>

                                </div>


                                <!-- User ID -->
                                <div class="mb-4">

                                    <label class="form-label fw-semibold">
                                        <i class="bi bi-hash me-2"></i>
                                        User ID
                                    </label>

                                    <div
                                        id="profileId"
                                        class="form-control bg-light">
                                        -
                                    </div>

                                </div>


                                <!-- Back -->
                                <div class="text-center mt-4">

                                    <a
                                        href="dashboard.html"
                                        class="btn btn-outline-primary">

                                        <i class="bi bi-arrow-left me-1"></i>

                                        Back to Dashboard

                                    </a>

                                </div>


                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </section>

    </main>


    <!-- Footer -->
    <div id="footerContainer"></div>


    <!-- Bootstrap JS -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>


    <!-- Main JS -->
    <script src="js/main.js"></script>


    <!-- Profile JS -->
    <script src="js/profile.js"></script>


</body>

</html>
