<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Create your SecurePass account and start improving your password security."
    >

    <title>Register | SecurePass</title>


    <!-- Google Font -->
    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >


    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >


    <!-- Global CSS -->
    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body class="d-flex flex-column min-vh-100">


    <!-- =====================================================
         Navbar
         ===================================================== -->

    <div id="navbarContainer"></div>


    <!-- =====================================================
         Main Content
         ===================================================== -->

    <main class="flex-grow-1">

        <section class="page-section">

            <div class="container">

                <div class="row justify-content-center">

                    <div class="col-lg-6 col-md-8">


                        <!-- Register Card -->

                        <div class="card shadow-sm">

                            <div class="card-body p-4 p-md-5">


                                <!-- Header -->

                                <div class="text-center mb-4">

                                    <div
                                        class="bg-primary bg-opacity-10 rounded-circle d-inline-flex align-items-center justify-content-center mb-3"
                                        style="width: 70px; height: 70px;"
                                    >

                                        <i
                                            class="bi bi-person-plus-fill text-primary fs-2"
                                        ></i>

                                    </div>


                                    <h2 class="fw-bold mb-2">
                                        Create Your Account
                                    </h2>


                                    <p class="text-secondary mb-0">
                                        Join SecurePass and improve your
                                        password security.
                                    </p>

                                </div>


                                <!-- Registration Form -->

                                <form id="registerForm" novalidate>


                                    <!-- Name -->

                                    <div class="mb-3">

                                        <label
                                            for="name"
                                            class="form-label fw-semibold"
                                        >
                                            Full Name
                                        </label>

                                        <div class="input-group">

                                            <span class="input-group-text">
                                                <i class="bi bi-person"></i>
                                            </span>

                                            <input
                                                type="text"
                                                class="form-control"
                                                id="name"
                                                name="name"
                                                placeholder="Enter your full name"
                                                autocomplete="name"
                                                required
                                            >

                                        </div>

                                    </div>


                                    <!-- Email -->

                                    <div class="mb-3">

                                        <label
                                            for="email"
                                            class="form-label fw-semibold"
                                        >
                                            Email Address
                                        </label>

                                        <div class="input-group">

                                            <span class="input-group-text">
                                                <i class="bi bi-envelope"></i>
                                            </span>

                                            <input
                                                type="email"
                                                class="form-control"
                                                id="email"
                                                name="email"
                                                placeholder="Enter your email"
                                                autocomplete="email"
                                                required
                                            >

                                        </div>

                                    </div>


                                    <!-- Password -->

                                    <div class="mb-3">

                                        <label
                                            for="password"
                                            class="form-label fw-semibold"
                                        >
                                            Password
                                        </label>

                                        <div class="input-group">

                                            <span class="input-group-text">
                                                <i class="bi bi-lock"></i>
                                            </span>

                                            <input
                                                type="password"
                                                class="form-control"
                                                id="password"
                                                name="password"
                                                placeholder="Create a password"
                                                autocomplete="new-password"
                                                required
                                            >

                                            <button
                                                type="button"
                                                class="btn btn-outline-secondary"
                                                id="togglePassword"
                                                aria-label="Show password"
                                            >
                                                <i
                                                    class="bi bi-eye"
                                                    id="passwordIcon"
                                                ></i>
                                            </button>

                                        </div>

                                        <div class="form-text">
                                            Password must contain at least
                                            8 characters.
                                        </div>

                                    </div>


                                    <!-- Confirm Password -->

                                    <div class="mb-3">

                                        <label
                                            for="confirmPassword"
                                            class="form-label fw-semibold"
                                        >
                                            Confirm Password
                                        </label>

                                        <div class="input-group">

                                            <span class="input-group-text">
                                                <i class="bi bi-lock-fill"></i>
                                            </span>

                                            <input
                                                type="password"
                                                class="form-control"
                                                id="confirmPassword"
                                                name="confirmPassword"
                                                placeholder="Confirm your password"
                                                autocomplete="new-password"
                                                required
                                            >

                                            <button
                                                type="button"
                                                class="btn btn-outline-secondary"
                                                id="toggleConfirmPassword"
                                                aria-label="Show password"
                                            >
                                                <i
                                                    class="bi bi-eye"
                                                    id="confirmPasswordIcon"
                                                ></i>
                                            </button>

                                        </div>

                                    </div>


                                    <!-- Password Match Message -->

                                    <div
                                        id="passwordMatchMessage"
                                        class="small mb-3"
                                    ></div>


                                    <!-- Terms -->

                                    <div class="form-check mb-4">

                                        <input
                                            class="form-check-input"
                                            type="checkbox"
                                            id="agreeTerms"
                                            required
                                        >

                                        <label
                                            class="form-check-label small"
                                            for="agreeTerms"
                                        >
                                            I understand that SecurePass is a
                                            password security analysis tool.
                                        </label>

                                    </div>


                                    <!-- Error Message -->

                                    <div
                                        id="registerError"
                                        class="alert alert-danger d-none"
                                        role="alert"
                                    ></div>


                                    <!-- Success Message -->

                                    <div
                                        id="registerSuccess"
                                        class="alert alert-success d-none"
                                        role="alert"
                                    ></div>


                                    <!-- Register Button -->

                                    <button
                                        type="submit"
                                        id="registerButton"
                                        class="btn btn-primary w-100 py-2"
                                    >

                                        <span
                                            id="registerButtonText"
                                        >
                                            <i
                                                class="bi bi-person-plus me-2"
                                            ></i>
                                            Create Account
                                        </span>

                                        <span
                                            id="registerSpinner"
                                            class="d-none"
                                        >
                                            <span
                                                class="spinner-border spinner-border-sm me-2"
                                                aria-hidden="true"
                                            ></span>
                                            Creating Account...
                                        </span>

                                    </button>


                                </form>


                                <!-- Login Link -->

                                <div class="text-center mt-4">

                                    <p class="text-secondary mb-0">

                                        Already have an account?

                                        <a
                                            href="login.html"
                                            class="text-primary text-decoration-none fw-semibold"
                                        >
                                            Login
                                        </a>

                                    </p>

                                </div>

                            </div>

                        </div>


                    </div>

                </div>

            </div>

        </section>

    </main>


    <!-- =====================================================
         Footer
         ===================================================== -->

    <div id="footerContainer"></div>


    <!-- Bootstrap JS -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>


    <!-- Main JS -->

    <script src="js/main.js"></script>


    <!-- Register JS -->

    <script src="js/register.js"></script>

</body>

</html>
