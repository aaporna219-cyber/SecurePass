<!DOCTYPE html>
<html lang="en">

<head>

    <!-- =====================================================
         Basic Meta
         ===================================================== -->

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Login to your SecurePass account and manage your password security."
    >

    <title>Login | SecurePass</title>


    <!-- =====================================================
         Google Font
         ===================================================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >


    <!-- =====================================================
         Bootstrap CSS
         ===================================================== -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- =====================================================
         Bootstrap Icons
         ===================================================== -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >


    <!-- =====================================================
         Global CSS
         ===================================================== -->

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body class="d-flex flex-column min-vh-100">


    <!-- =====================================================
         Navbar
         ===================================================== -->

    <div id="navbarContainer"></div>


    <!-- =====================================================
         Main Content
         ===================================================== -->

    <main class="flex-grow-1">

        <section class="page-section">

            <div class="container">

                <div class="row justify-content-center">

                    <div class="col-lg-5 col-md-7">


                        <!-- Login Card -->

                        <div class="card shadow-sm">

                            <div class="card-body p-4 p-md-5">


                                <!-- Header -->

                                <div class="text-center mb-4">

                                    <div
                                        class="bg-primary bg-opacity-10 rounded-circle d-inline-flex align-items-center justify-content-center mb-3"
                                        style="width: 70px; height: 70px;"
                                    >

                                        <i
                                            class="bi bi-shield-lock-fill text-primary fs-2"
                                        ></i>

                                    </div>


                                    <h2 class="fw-bold mb-2">
                                        Welcome Back
                                    </h2>


                                    <p class="text-secondary mb-0">
                                        Login to continue to SecurePass.
                                    </p>

                                </div>


                                <!-- Login Form -->

                                <form id="loginForm" novalidate>


                                    <!-- Email -->

                                    <div class="mb-3">

                                        <label
                                            for="email"
                                            class="form-label fw-semibold"
                                        >
                                            Email Address
                                        </label>

                                        <div class="input-group">

                                            <span class="input-group-text">
                                                <i class="bi bi-envelope"></i>
                                            </span>

                                            <input
                                                type="email"
                                                class="form-control"
                                                id="email"
                                                name="email"
                                                placeholder="Enter your email"
                                                autocomplete="email"
                                                required
                                            >

                                        </div>

                                    </div>


                                    <!-- Password -->

                                    <div class="mb-3">

                                        <div
                                            class="d-flex justify-content-between align-items-center"
                                        >

                                            <label
                                                for="password"
                                                class="form-label fw-semibold mb-2"
                                            >
                                                Password
                                            </label>

                                        </div>


                                        <div class="input-group">

                                            <span class="input-group-text">
                                                <i class="bi bi-lock"></i>
                                            </span>

                                            <input
                                                type="password"
                                                class="form-control"
                                                id="password"
                                                name="password"
                                                placeholder="Enter your password"
                                                autocomplete="current-password"
                                                required
                                            >

                                            <button
                                                type="button"
                                                class="btn btn-outline-secondary"
                                                id="togglePassword"
                                                aria-label="Show password"
                                            >

                                                <i
                                                    class="bi bi-eye"
                                                    id="passwordIcon"
                                                ></i>

                                            </button>

                                        </div>

                                    </div>


                                    <!-- Remember Me -->

                                    <div class="form-check mb-4">

                                        <input
                                            class="form-check-input"
                                            type="checkbox"
                                            id="rememberMe"
                                        >

                                        <label
                                            class="form-check-label small"
                                            for="rememberMe"
                                        >
                                            Remember me
                                        </label>

                                    </div>


                                    <!-- Error Message -->

                                    <div
                                        id="loginError"
                                        class="alert alert-danger d-none"
                                        role="alert"
                                    ></div>


                                    <!-- Success Message -->

                                    <div
                                        id="loginSuccess"
                                        class="alert alert-success d-none"
                                        role="alert"
                                    ></div>


                                    <!-- Login Button -->

                                    <button
                                        type="submit"
                                        id="loginButton"
                                        class="btn btn-primary w-100 py-2"
                                    >

                                        <span id="loginButtonText">

                                            <i
                                                class="bi bi-box-arrow-in-right me-2"
                                            ></i>

                                            Login

                                        </span>


                                        <span
                                            id="loginSpinner"
                                            class="d-none"
                                        >

                                            <span
                                                class="spinner-border spinner-border-sm me-2"
                                                aria-hidden="true"
                                            ></span>

                                            Signing In...

                                        </span>

                                    </button>


                                </form>


                                <!-- Register Link -->

                                <div class="text-center mt-4">

                                    <p class="text-secondary mb-0">

                                        Don't have an account?

                                        <a
                                            href="register.html"
                                            class="text-primary text-decoration-none fw-semibold"
                                        >
                                            Create Account
                                        </a>

                                    </p>

                                </div>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </section>

    </main>


    <!-- =====================================================
         Footer
         ===================================================== -->

    <div id="footerContainer"></div>


    <!-- =====================================================
         Bootstrap JavaScript
         ===================================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>


    <!-- =====================================================
         Main JavaScript
         ===================================================== -->

    <script src="js/main.js"></script>


    <!-- =====================================================
         Login JavaScript
         ===================================================== -->

    <script src="js/login.js"></script>

</body>

</html>
